name: Build IPA

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Check toolchain
        run: bash scripts/check-xcode-toolchain.sh

      - name: Install XcodeGen
        # Pinned to the version project.yml is written against (2.46 — see the
        # "quirks this file works around" note there), not brew's latest, so the
        # generated project cannot change under a runner image bump.  The release
        # zip is a universal binary *plus* its SettingPresets, and XcodeGen finds
        # those relative to the executable, so the unpacked directory goes on
        # PATH rather than a copied single file.
        env:
          XCODEGEN_VERSION: 2.46.0
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/xcodegen"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$DEST"
          echo "$DEST/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate the Xcode project
        # GoldenNuggetMobile.xcodeproj is a build product of project.yml and is
        # gitignored, so CI regenerates it before xcodebuild can read it.  The
        # manifest's postGenCommand runs scripts/sync-pbxproj-sources.py, which
        # reconciles the Sources phase to what SwiftPM resolves — the same
        # two-step generation a local run does, so the host and CI agree.
        run: |
          xcodegen --version
          xcodegen generate

      # The only supported build path.  It drives GoldenNuggetMobile.xcodeproj
      # through xcodebuild and packages build/GoldenNuggetMobile.ipa; the same
      # script is what the local workflow runs, so CI and the host cannot
      # drift apart.
      - name: Build IPA
        run: ./scripts/build-ipa.sh Release

      # The build above emitted `.stringsdata`; this compares them with the
      # committed String Catalog.  A Text("…") that was added without being
      # extracted, or a key whose text changed, fails here rather than shipping
      # as untranslatable English.
      - name: Check localization catalog
        run: python3 scripts/sync-localizations.py --check

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: GoldenNuggetMobile
          path: build/GoldenNuggetMobile.ipa
          if-no-files-found: error

      # Tagged releases: pushing `v<version>` (or `v<version>-pre.<build>` for a
      # pre-release, which `releases/latest` and the in-app updater ignore)
      # publishes the IPA just built. The asset name carries the version and
      # build number, and the notes are the matching CHANGELOG.md section,
      # never generic text. The FlareStore feed (repo.json) is not touched.
      - name: Publish release (tags v* only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          INFO=layout/Applications/GoldenNuggetMobile.app/Info.plist
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO")
          if [ "$TAG" = "v${VERSION}" ]; then
            KIND=release; FLAGS=""
          elif [ "$TAG" = "v${VERSION}-pre.${BUILD}" ]; then
            KIND=pre-release; FLAGS="--prerelease"
          else
            echo "Tag $TAG matches neither v${VERSION} nor v${VERSION}-pre.${BUILD}; refusing to publish." >&2
            exit 1
          fi
          BUILT=$(unzip -p build/GoldenNuggetMobile.ipa 'Payload/*.app/Info.plist' > "$RUNNER_TEMP/built.plist" && \
                  /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$RUNNER_TEMP/built.plist")
          if [ "$BUILT" != "$BUILD" ]; then
            echo "Built IPA reports build $BUILT, expected $BUILD; refusing to publish." >&2
            exit 1
          fi
          ASSET="build/GoldenNuggetMobile-${VERSION}-build${BUILD}.ipa"
          cp build/GoldenNuggetMobile.ipa "$ASSET"
          # The CHANGELOG section headed "## <version> (<build>)".
          awk -v head="## ${VERSION} (${BUILD})" '
            index($0, head) == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "CHANGELOG.md has no section for ${VERSION} (${BUILD}); refusing to publish." >&2
            exit 1
          fi
          {
            echo
            echo "Unsigned IPA for sideloading. SHA-256: \`$(shasum -a 256 "$ASSET" | cut -d' ' -f1)\`"
            echo "Built from \`${GITHUB_SHA}\`."
          } >> "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Refusing to overwrite a release asset." >&2
            exit 1
          fi
          # shellcheck disable=SC2086
          gh release create "$TAG" "$ASSET" $FLAGS --verify-tag \
            --title "GoldenNugget Mobile ${VERSION} (${BUILD})$([ "$KIND" = pre-release ] && echo ' pre-release')" \
            --notes-file "$RUNNER_TEMP/notes.md"

# Manual rebuild trigger
